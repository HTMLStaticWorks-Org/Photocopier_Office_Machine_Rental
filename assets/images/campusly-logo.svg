<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pcNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172B4D" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Corporate Printer / Copier Emblem -->
  <g transform="translate(12, 11)">
    <!-- Rounded badge -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#pcGrad)" opacity="0.12" />
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="url(#pcGrad)" stroke-width="1.5" />

    <!-- Top paper feed -->
    <rect x="15" y="9" width="18" height="8" rx="1.5" fill="#172B4D" />
    <line x1="18" y1="12.5" x2="30" y2="12.5" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" />

    <!-- Main copier chassis -->
    <rect x="9" y="16" width="30" height="16" rx="3" fill="url(#pcGrad)" />
    <!-- Status indicator -->
    <circle cx="34" cy="21" r="1.8" fill="#FFFFFF" />
    <rect x="13" y="20" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.85" />

    <!-- Output document tray -->
    <rect x="14" y="28" width="20" height="11" rx="1.5" fill="#FFFFFF" stroke="#172B4D" stroke-width="1.5" />
    <line x1="17.5" y1="32" x2="30.5" y2="32" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" />
    <line x1="17.5" y1="35.5" x2="26.5" y2="35.5" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(72, 25)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', 'Manrope', 'Inter', sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#172B4D">
      PRINTCORE
    </text>
    <text x="1" y="34" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#2563EB">
      OFFICE MACHINE RENTAL
    </text>
  </g>
</svg>

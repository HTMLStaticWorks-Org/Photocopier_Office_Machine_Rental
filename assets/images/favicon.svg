<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172B4D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#favBg)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#favAccent)" stroke-width="8" opacity="0.45" />

  <!-- Top paper feed -->
  <rect x="168" y="106" width="176" height="72" rx="14" fill="#E2E8F0" />
  <line x1="198" y1="138" x2="314" y2="138" stroke="#2563EB" stroke-width="14" stroke-linecap="round" />

  <!-- Main printer body -->
  <rect x="104" y="170" width="304" height="160" rx="28" fill="url(#favAccent)" />
  <circle cx="356" cy="222" r="16" fill="#FFFFFF" />
  <rect x="144" y="212" width="96" height="20" rx="10" fill="#FFFFFF" opacity="0.85" />

  <!-- Output sheet -->
  <rect x="156" y="290" width="200" height="116" rx="14" fill="#FFFFFF" stroke="#172B4D" stroke-width="12" />
  <line x1="192" y1="332" x2="320" y2="332" stroke="#2563EB" stroke-width="14" stroke-linecap="round" />
  <line x1="192" y1="368" x2="284" y2="368" stroke="#06B6D4" stroke-width="14" stroke-linecap="round" />
</svg>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Business Account — PrintCore Office Machine Rental</title>
  <meta name="description" content="Register your company with PrintCore to request photocopiers, manage rental agreements, schedule technician support, and view monthly invoices.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Icon Font -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Reveal-on-scroll: flag JS before first paint to avoid a flash -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="auth-body">

  <!-- Top Utilities Bar -->
  <div class="auth-topbar">
    <div class="auth-top-actions">
      <button class="theme-toggle" aria-label="Toggle Dark Mode" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border);">
        <i class="ph ph-moon"></i>
      </button>
      <button class="rtl-toggle" aria-label="Toggle RTL" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border);">
        <i class="ph ph-arrows-left-right"></i>
      </button>
    </div>
  </div>

  <!-- Centered Auth Card Container -->
  <main class="auth-card animate-flip-up">
    <!-- Brand Logo -->
    <a href="index.html" class="auth-brand" aria-label="PrintCore Home"><img src="assets/images/campusly-logo.svg" alt="PrintCore Office Machine Rental" class="logo-img"></a>

    <!-- Title & Subtitle -->
    <h1 class="auth-title">Create Business Account</h1>
    <p class="auth-subtitle">Set up your company portal to request photocopier rentals, monitor fleet usage, and manage billing</p>

    <!-- Register Form -->
    <form class="auth-form validate-form" action="dashboard.html" method="GET" novalidate>
      <div class="form-group">
        <label class="auth-label" for="company">COMPANY NAME</label>
        <input type="text" id="company" name="company" class="auth-input form-control" required placeholder="Meridian Legal Group">
      </div>

      <div class="form-group">
        <label class="auth-label" for="email">BUSINESS EMAIL</label>
        <input type="email" id="email" name="email" class="auth-input form-control" required placeholder="operations@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="auth-label" for="password">PASSWORD</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" class="auth-input form-control" required placeholder="Create a strong password" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <div class="auth-controls-row">
        <label class="auth-checkbox-label">
          <input type="checkbox" name="terms" class="auth-checkbox" required>
          <span>I agree to the rental portal terms</span>
        </label>
      </div>

      <button type="submit" class="btn-auth-submit">CREATE BUSINESS ACCOUNT</button>
    </form>

    <div class="auth-card-footer">
      Already have a business account? <a href="login.html">Sign in here</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
